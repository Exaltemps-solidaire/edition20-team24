# Sert l'export statique de Next.js (out/). Les routes /api/ et /_reveil sont prises par le proxy d'entrée.
# En-têtes de sécurité repris de core-platform/templates/nginx.conf (CCOE-RULES §3.2) ;
# connect-src réduit à 'self' car l'app n'appelle que son API, en chemin relatif.
# script-src autorise 'unsafe-inline' : Next.js embarque dans index.html deux <script> inline
# (bootstrap __next_f du RSC payload) indispensables à l'hydratation ; sans eux la page reste
# bloquée sur l'état de chargement initial, sans erreur serveur. Pas de CDN, tout reste 'self'.
server {
  listen 80;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; script-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  # Contrôles de santé : fichiers statiques public/health et public/sante.
  location ~ ^/(health|sante)$ {
    default_type text/plain;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
